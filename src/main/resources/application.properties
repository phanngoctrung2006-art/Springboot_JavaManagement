spring.application.name=SpringBoot1-1
server.port=8081

# Mã hóa UTF-8 tiếng Việt cho request/response
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ==========================================
# 2. VIEW RESOLVER FOR JSP (BẮT BUỘC ĐỂ CHẠY JSP)
# Thư mục thực tế: src/main/webapp/WEB-INF/views/
# ==========================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.mvc.static-path-pattern=/static/**
# Kết nối CSDL
spring.datasource.url=jdbc:mysql://localhost:3306/Springboot
spring.datasource.username=root
spring.datasource.password=123456

# Cấu hình Hibernate (thay thế cho persistence.xml)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

storage.location=uploads
